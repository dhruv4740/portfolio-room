<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gravity — Dhruv Kothari</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --chip-bg: #1a1a1f;
    --chip-border: #2e2e38;
    --accent: #c6ff3a;
    --text-primary: #e8e8f0;
    --text-muted: #55556a;
    --font: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--font);
  }

  #canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* back link */
  #back {
    position: fixed;
    top: 18px; left: 20px;
    z-index: 10;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 11px;
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 0.2s;
    pointer-events: auto;
  }
  #back:hover { color: var(--text-primary); }

  /* concept label */
  #label {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    pointer-events: none;
  }
  #label .title {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--text-primary);
    text-transform: uppercase;
  }
  #label .hint {
    display: block;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* controls */
  #controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 10px;
  }
  #controls button {
    background: #1a1a1f;
    border: 1px solid #2e2e38;
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 0.15em;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 4px;
    text-transform: uppercase;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  #controls button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #1f2010;
  }
  #controls button:active {
    background: #252a10;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<a id="back" href="index.html">← concepts</a>

<div id="label">
  <span class="title">Gravity</span>
  <span class="hint">drag · fling · shake</span>
</div>

<div id="controls">
  <button id="btn-shake">Shake</button>
  <button id="btn-reset">Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function () {
  'use strict';

  // ── Palette ──────────────────────────────────────────────────────────────
  const BG        = '#0e0e10';
  const CHIP_BG   = '#1a1a1f';
  const CHIP_EDGE = '#2e2e38';
  const ACCENT    = '#c6ff3a';
  const TEXT_COL  = '#e8e8f0';
  const TEXT_DIM  = '#8888aa';
  const FONT      = "600 13px 'SF Mono','Fira Code','Cascadia Code',ui-monospace,monospace";
  const FONT_SM   = "500 11px 'SF Mono','Fira Code','Cascadia Code',ui-monospace,monospace";

  // ── Chip data ─────────────────────────────────────────────────────────────
  // Each chip has a label. We'll auto-size width from text, with a min/max.
  const CHIP_LABELS = [
    'Dhruv Kothari',
    'Reddit Growth Copilot',
    'React',
    'Three.js',
    'WebGL',
    'GSAP',
    'TypeScript',
    'Node.js',
    'Next.js',
    'Shaders',
    'Framer',
    'Design',
    'Matter.js',
    'CSS',
    'Vite',
    'R3F',
    'Python',
    'UI/UX',
    'Canvas 2D',
    'Git',
  ];

  // ── Matter.js aliases ─────────────────────────────────────────────────────
  const { Engine, Render, Runner, Bodies, Body, Composite, Mouse,
          MouseConstraint, Events, World } = Matter;

  // ── State ─────────────────────────────────────────────────────────────────
  let engine, world, mouseConstraint;
  let chips = [];         // [{body, label, w, h, accent}]
  let walls = [];         // static boundary bodies
  let raf;
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');

  // ── Measure text width ───────────────────────────────────────────────────
  function measureLabel(label) {
    ctx.save();
    ctx.font = FONT;
    const tw = ctx.measureText(label).width;
    ctx.restore();
    return tw;
  }

  // ── Build walls ───────────────────────────────────────────────────────────
  const WALL_T = 60; // thickness

  function buildWalls(W, H) {
    // Remove old walls
    if (walls.length) {
      Composite.remove(world, walls);
      walls = [];
    }

    const opts = { isStatic: true, friction: 0.3, restitution: 0.2, render: { visible: false } };
    const floor  = Bodies.rectangle(W / 2, H + WALL_T / 2,  W + WALL_T * 2, WALL_T, opts);
    const left   = Bodies.rectangle(-WALL_T / 2, H / 2, WALL_T, H * 3, opts);
    const right  = Bodies.rectangle(W + WALL_T / 2, H / 2, WALL_T, H * 3, opts);
    const top    = Bodies.rectangle(W / 2, -WALL_T / 2, W + WALL_T * 2, WALL_T, opts);

    walls = [floor, left, right, top];
    Composite.add(world, walls);
  }

  // ── Build chips ───────────────────────────────────────────────────────────
  const CHIP_PAD_X = 22;
  const CHIP_H     = 34;
  const RADIUS     = 7;   // corner radius (visual only; physics uses rectangle)

  function buildChips(W, H) {
    // Remove old chips
    chips.forEach(c => Composite.remove(world, c.body));
    chips = [];

    const LABELS = [...CHIP_LABELS];

    // Shuffle so drop order is varied each reset
    for (let i = LABELS.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [LABELS[i], LABELS[j]] = [LABELS[j], LABELS[i]];
    }

    // Accent chips (a few get highlighted)
    const accentSet = new Set(['Dhruv Kothari', 'Reddit Growth Copilot', 'React', 'Three.js', 'WebGL']);

    LABELS.forEach((label, i) => {
      const tw   = measureLabel(label);
      const cw   = Math.max(tw + CHIP_PAD_X * 2, 80);
      const ch   = CHIP_H;
      const isAccent = accentSet.has(label);

      // Drop from random x near top, staggered
      const spawnX = WALL_T + Math.random() * (W - WALL_T * 2 - cw);
      const spawnY = -ch * 2 - i * (ch + 8);

      const body = Bodies.rectangle(
        spawnX + cw / 2,
        spawnY,
        cw,
        ch,
        {
          restitution: 0.25,
          friction: 0.55,
          frictionAir: 0.018,
          density: 0.003,
          chamfer: { radius: RADIUS },
          label: label,
        }
      );

      // Small random initial angle
      Body.setAngle(body, (Math.random() - 0.5) * 0.3);

      Composite.add(world, body);
      chips.push({ body, label, w: cw, h: ch, isAccent });
    });
  }

  // ── Init / reinit ─────────────────────────────────────────────────────────
  function init() {
    const W = window.innerWidth;
    const H = window.innerHeight;

    canvas.width  = W;
    canvas.height = H;

    if (!engine) {
      engine = Engine.create({ gravity: { x: 0, y: 1.4 } });
      world  = engine.world;
    } else {
      // Clear everything
      World.clear(world, false);
      Engine.clear(engine);
      engine.gravity.y = 1.4;
      walls = [];
      chips = [];
    }

    buildWalls(W, H);
    buildChips(W, H);

    // Mouse constraint (also handles touch via pointer events mapped by Matter)
    const mouse = Mouse.create(canvas);
    // Fix scroll offset issues
    mouse.pixelRatio = window.devicePixelRatio || 1;

    mouseConstraint = MouseConstraint.create(engine, {
      mouse,
      constraint: {
        stiffness: 0.2,
        damping: 0.1,
        render: { visible: false },
      },
    });
    Composite.add(world, mouseConstraint);
  }

  // ── Draw rounded rect ─────────────────────────────────────────────────────
  function drawRoundRect(cx2d, x, y, w, h, r) {
    cx2d.beginPath();
    cx2d.moveTo(x + r, y);
    cx2d.lineTo(x + w - r, y);
    cx2d.arcTo(x + w, y,     x + w, y + r,     r);
    cx2d.lineTo(x + w, y + h - r);
    cx2d.arcTo(x + w, y + h, x + w - r, y + h, r);
    cx2d.lineTo(x + r, y + h);
    cx2d.arcTo(x,     y + h, x,       y + h - r, r);
    cx2d.lineTo(x, y + r);
    cx2d.arcTo(x,     y,     x + r,   y,         r);
    cx2d.closePath();
  }

  // ── Render frame ──────────────────────────────────────────────────────────
  function renderFrame() {
    const W = canvas.width;
    const H = canvas.height;

    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // Draw each chip
    chips.forEach(({ body, label, w, h, isAccent }) => {
      const pos   = body.position;
      const angle = body.angle;

      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(angle);

      const x = -w / 2;
      const y = -h / 2;

      // Shadow
      ctx.shadowColor  = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur   = 14;
      ctx.shadowOffsetY = 4;

      // Fill
      if (isAccent) {
        ctx.fillStyle = '#1e2410';
      } else {
        ctx.fillStyle = CHIP_BG;
      }
      drawRoundRect(ctx, x, y, w, h, RADIUS);
      ctx.fill();

      // Border
      ctx.shadowColor  = 'transparent';
      ctx.shadowBlur   = 0;
      ctx.shadowOffsetY = 0;

      ctx.strokeStyle = isAccent ? ACCENT : CHIP_EDGE;
      ctx.lineWidth   = isAccent ? 1.5 : 1;
      drawRoundRect(ctx, x, y, w, h, RADIUS);
      ctx.stroke();

      // Accent left bar
      if (isAccent) {
        ctx.fillStyle = ACCENT;
        drawRoundRect(ctx, x, y + 6, 3, h - 12, 1.5);
        ctx.fill();
      }

      // Label text
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = isAccent ? FONT : FONT_SM;
      ctx.fillStyle    = isAccent ? ACCENT : TEXT_COL;
      ctx.shadowColor  = 'transparent';
      ctx.fillText(label, 0, 0);

      ctx.restore();
    });
  }

  // ── Loop ──────────────────────────────────────────────────────────────────
  let lastTime = 0;

  function loop(ts) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min(ts - lastTime, 32); // cap at ~30fps equiv for stability
    lastTime = ts;

    Engine.update(engine, dt);
    renderFrame();
  }

  // ── Shake ─────────────────────────────────────────────────────────────────
  function shake() {
    chips.forEach(({ body }) => {
      const fx = (Math.random() - 0.5) * 0.06;
      const fy = -(Math.random() * 0.04 + 0.02);
      Body.applyForce(body, body.position, { x: fx, y: fy });
    });
  }

  // ── Reset ─────────────────────────────────────────────────────────────────
  function reset() {
    if (raf) cancelAnimationFrame(raf);
    lastTime = 0;
    init();
    raf = requestAnimationFrame(loop);
  }

  // ── Resize ────────────────────────────────────────────────────────────────
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(reset, 120);
  });

  // ── Buttons ───────────────────────────────────────────────────────────────
  document.getElementById('btn-shake').addEventListener('click', shake);
  document.getElementById('btn-reset').addEventListener('click', reset);

  // ── Touch passthrough for MouseConstraint ─────────────────────────────────
  // Matter.js MouseConstraint already handles touch if we pass touch events
  // through the mouse element. We just need to prevent default scroll.
  canvas.addEventListener('touchstart',  e => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchmove',   e => e.preventDefault(), { passive: false });

  // ── Boot ──────────────────────────────────────────────────────────────────
  init();
  raf = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
