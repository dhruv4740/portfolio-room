<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chromatic — Dhruv Kothari</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{
  background:#050507;
  color:#e8e8f0;
  font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow-x:hidden;
  height:400vh;
}
#canvas-wrap{
  position:fixed;
  inset:0;
  z-index:0;
}
canvas{display:block;width:100%!important;height:100%!important;}

/* vignette overlay */
#vignette{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, rgba(5,5,7,0.72) 100%);
}

/* back link */
#back{
  position:fixed;
  top:22px;
  left:24px;
  z-index:10;
  color:rgba(255,255,255,0.32);
  text-decoration:none;
  font-family:'SF Mono',ui-monospace,monospace;
  font-size:11px;
  letter-spacing:0.04em;
  transition:color 0.2s;
}
#back:hover{color:rgba(255,255,255,0.7);}

/* concept label */
#label{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  text-align:center;
  pointer-events:none;
  user-select:none;
}
#label h1{
  font-size:clamp(14px,1.4vw,20px);
  font-weight:300;
  letter-spacing:0.45em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.08);
  margin-bottom:6px;
}
#name{
  font-size:clamp(36px,5.5vw,76px);
  font-weight:700;
  letter-spacing:-0.02em;
  line-height:1;
  background:linear-gradient(135deg,#fff 0%,rgba(200,180,255,0.85) 40%,rgba(130,210,255,0.8) 70%,#fff 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
#hint{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  font-family:'SF Mono',ui-monospace,monospace;
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.22);
}

/* webgl warning */
#no-webgl{
  display:none;
  position:fixed;
  inset:0;
  z-index:99;
  background:#050507;
  color:rgba(255,255,255,0.4);
  font-family:monospace;
  font-size:14px;
  align-items:center;
  justify-content:center;
}
</style>
</head>
<body>

<a id="back" href="index.html">← concepts</a>
<div id="vignette"></div>

<div id="label">
  <h1>Chromatic</h1>
  <div id="name">Dhruv Kothari</div>
</div>

<p id="hint">scroll to morph</p>

<div id="canvas-wrap"></div>
<div id="no-webgl">WebGL is not available in this browser.</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ── WebGL guard ────────────────────────────────────────────────────
const canvas = document.createElement('canvas');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) {
  document.getElementById('no-webgl').style.display = 'flex';
  throw new Error('WebGL unavailable');
}

// ── Scene setup ────────────────────────────────────────────────────
const wrap  = document.getElementById('canvas-wrap');
const W = () => wrap.clientWidth;
const H = () => wrap.clientHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
wrap.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x050507);

const camera = new THREE.PerspectiveCamera(42, W()/H(), 0.1, 100);
camera.position.set(0, 0, 3.8);

// ── Post-processing ────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(W(), H()),
  0.6,   // strength
  0.38,  // radius
  0.82   // threshold
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ── GLSL noise ────────────────────────────────────────────────────
// Simplex 3-D noise (Ashima Arts / Ian McEwan public domain)
const SNOISE_GLSL = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);
  const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(
    i.z+vec4(0.,i1.z,i2.z,1.))
    +i.y+vec4(0.,i1.y,i2.y,1.))
    +i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.;
  vec4 s1=floor(b1)*2.+1.;
  vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
  m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

// FBM layering
float fbm(vec3 p,float freq,float amp,float scroll){
  float v=0.;float a=amp;float f=freq;
  // layer 1 — base breathing
  v+=a*snoise(p*f+vec3(0.,0.,0.31));
  a*=.52;f*=2.1;
  // layer 2 — mid detail
  v+=a*snoise(p*f+vec3(1.7,0.9,-0.5));
  a*=.52;f*=2.1;
  // layer 3 — fine wrinkles (ramped by scroll)
  v+=a*(1.+scroll*2.)*snoise(p*f+vec3(-0.8,1.2,0.6));
  a*=.52;f*=2.1;
  // layer 4 — chaos spike (full scroll)
  v+=a*scroll*snoise(p*f+vec3(0.3,-1.1,0.9));
  return v;
}
`;

// ── Vertex shader ─────────────────────────────────────────────────
const vertexShader = /* glsl */`
${SNOISE_GLSL}

uniform float uTime;
uniform float uScroll; // 0..1

varying vec3 vNormal;
varying vec3 vPosition;
varying vec3 vViewDir;
varying float vDisplace;

void main(){
  vec3 pos = position;
  vec3 nor = normal;

  // displacement amplitude transitions: calm sphere → spiky chaos
  float baseAmp  = mix(0.18, 0.54, uScroll);
  float baseFreq = mix(1.4,  3.2,  uScroll);

  float d = fbm(pos + vec3(uTime * 0.18), baseFreq, baseAmp, uScroll);
  vec3 displaced = pos + nor * d;

  // perturb normal analytically using finite differences (epsilon)
  float eps = 0.004;
  float dx = fbm(pos + vec3(eps,0.,0.) + vec3(uTime*0.18), baseFreq, baseAmp, uScroll)
           - fbm(pos - vec3(eps,0.,0.) + vec3(uTime*0.18), baseFreq, baseAmp, uScroll);
  float dy = fbm(pos + vec3(0.,eps,0.) + vec3(uTime*0.18), baseFreq, baseAmp, uScroll)
           - fbm(pos - vec3(0.,eps,0.) + vec3(uTime*0.18), baseFreq, baseAmp, uScroll);
  float dz = fbm(pos + vec3(0.,0.,eps) + vec3(uTime*0.18), baseFreq, baseAmp, uScroll)
           - fbm(pos - vec3(0.,0.,eps) + vec3(uTime*0.18), baseFreq, baseAmp, uScroll);
  vec3 grad = vec3(dx,dy,dz) / (2.*eps);
  vec3 perturbedNormal = normalize(nor - grad);

  vNormal    = normalize((normalMatrix * perturbedNormal));
  vPosition  = displaced;
  vDisplace  = d;

  vec4 mvPos  = modelViewMatrix * vec4(displaced, 1.0);
  vViewDir    = normalize(-mvPos.xyz);

  gl_Position = projectionMatrix * mvPos;
}
`;

// ── Fragment shader — thin-film iridescence ───────────────────────
const fragmentShader = /* glsl */`
uniform float uTime;
uniform float uScroll;

varying vec3 vNormal;
varying vec3 vPosition;
varying vec3 vViewDir;
varying float vDisplace;

// cosine color palette (Inigo Quilez)
vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d){
  return a + b * cos(6.28318*(c*t+d));
}

// oil-slick rainbow palette
vec3 iridescence(float t){
  // twin palette blend for richness
  vec3 p1 = palette(t,
    vec3(0.55,0.55,0.55),
    vec3(0.50,0.50,0.50),
    vec3(1.00,1.00,1.00),
    vec3(0.00,0.33,0.67)
  );
  vec3 p2 = palette(t + 0.22,
    vec3(0.60,0.50,0.60),
    vec3(0.40,0.40,0.50),
    vec3(2.00,1.00,0.00),
    vec3(0.50,0.20,0.25)
  );
  return mix(p1, p2, 0.45);
}

void main(){
  vec3 N = normalize(vNormal);
  vec3 V = normalize(vViewDir);

  // fresnel
  float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.5);

  // thin-film shift driven by fresnel + time drift + scroll
  float shift = fresnel * 2.2 + uTime * 0.05 + vDisplace * 1.8 + uScroll * 1.4;

  vec3 iriColor = iridescence(shift);

  // chrome base: fake hemisphere diffuse (up-sky / down-ground)
  float hemi = dot(N, vec3(0., 1., 0.)) * 0.5 + 0.5;
  vec3 skyCol  = vec3(0.12, 0.16, 0.28);
  vec3 gndCol  = vec3(0.05, 0.04, 0.08);
  vec3 chrome  = mix(gndCol, skyCol, hemi);

  // fake specular (Phong) for the gloss highlight
  vec3 L = normalize(vec3(1.2, 1.8, 2.0));
  vec3 R = reflect(-L, N);
  float spec = pow(max(dot(R, V), 0.0), 128.0);

  // rim glow — edges bloom extra
  float rim = pow(1.0 - max(dot(N, V), 0.0), 4.0);

  // composite
  vec3 color = chrome * 0.4;                       // base chrome
  color      = mix(color, iriColor, 0.75 + fresnel * 0.25); // iridescent overlay
  color     += vec3(1.0) * spec * 0.9;             // specular hot spot
  color     += iriColor * rim * 0.55;              // iridescent rim
  color     *= mix(0.82, 1.05, hemi);              // subtle shading

  gl_FragColor = vec4(color, 1.0);
}
`;

// ── Geometry ───────────────────────────────────────────────────────
// detail 80 → ~76k verts, good balance of performance & silhouette
const geo = new THREE.IcosahedronGeometry(1.0, 80);

const uniforms = {
  uTime:   { value: 0 },
  uScroll: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms,
  side: THREE.FrontSide,
});

const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

// ── Mouse parallax ─────────────────────────────────────────────────
const mouse  = { x: 0, y: 0 };
const target = { rx: 0, ry: 0 };
window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / window.innerWidth  - 0.5) * 2;
  mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
});

// ── Scroll ────────────────────────────────────────────────────────
let scrollY = 0;
window.addEventListener('scroll', () => { scrollY = window.scrollY; }, { passive: true });

// ── Resize ────────────────────────────────────────────────────────
function onResize() {
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
  composer.setSize(W(), H());
  bloom.resolution.set(W(), H());
}
window.addEventListener('resize', onResize);

// ── rAF loop ──────────────────────────────────────────────────────
let lastT = 0;
function animate(t) {
  requestAnimationFrame(animate);

  const dt   = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  const time = t / 1000;

  // scroll progress 0→1 over page height minus viewport
  const maxScroll = Math.max(document.body.scrollHeight - window.innerHeight, 1);
  const scroll    = Math.min(scrollY / maxScroll, 1);

  uniforms.uTime.value   = time;
  uniforms.uScroll.value = scroll;

  // auto-rotate
  mesh.rotation.y += 0.004 * dt * 60;

  // mouse parallax — ease toward target
  target.rx += (-mouse.y * 0.22 - target.rx) * 0.06;
  target.ry += ( mouse.x * 0.22 - target.ry) * 0.06;
  mesh.rotation.x = target.rx;
  // ry is additive to auto-rotate; handled separately above

  composer.render();
}

requestAnimationFrame(animate);
</script>
</body>
</html>
