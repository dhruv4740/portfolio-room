<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance — Dhruv Kothari</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon-cyan: #00ffe7;
    --neon-purple: #bf00ff;
    --neon-pink: #ff006a;
    --bg: #050508;
    --muted: #444;
    --font-mono: 'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: var(--font-mono);
    overflow: hidden;
  }

  canvas { display: block; position: fixed; inset: 0; z-index: 0; }

  /* Back link */
  #back {
    position: fixed; top: 18px; left: 22px; z-index: 100;
    font-size: 11px; letter-spacing: 0.08em;
    color: var(--muted); text-decoration: none;
    transition: color 0.2s;
  }
  #back:hover { color: var(--neon-cyan); }

  /* Concept label */
  #label {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 100; text-align: center; pointer-events: none;
  }
  #label .title {
    font-size: 11px; letter-spacing: 0.35em;
    color: var(--neon-cyan); opacity: 0.7;
    text-transform: uppercase;
  }
  #label .hint {
    font-size: 9px; letter-spacing: 0.1em; color: var(--muted);
    margin-top: 3px;
  }

  /* Name */
  #name {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    z-index: 100; text-align: center; pointer-events: none;
  }
  #name .full {
    font-size: 13px; letter-spacing: 0.5em; color: rgba(255,255,255,0.18);
    text-transform: uppercase;
  }

  /* Play button */
  #play-btn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    background: transparent;
    border: 1.5px solid rgba(0,255,231,0.4);
    color: var(--neon-cyan);
    font-family: var(--font-mono);
    font-size: 14px; letter-spacing: 0.25em;
    padding: 18px 40px;
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s, color 0.25s, box-shadow 0.25s;
    outline: none;
    border-radius: 2px;
  }
  #play-btn:hover {
    background: rgba(0,255,231,0.07);
    border-color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0,255,231,0.3);
  }

  /* Controls row */
  #controls {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; gap: 14px; align-items: center;
    opacity: 0; transition: opacity 0.5s;
    pointer-events: none;
  }
  #controls.visible { opacity: 1; pointer-events: auto; }

  #mic-btn, #stop-btn {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.15em;
    padding: 7px 16px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    border-radius: 2px;
  }
  #mic-btn:hover { border-color: var(--neon-purple); color: var(--neon-purple); }
  #mic-btn.active { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,106,0.3); }
  #stop-btn:hover { border-color: #ff4444; color: #ff4444; }

  /* WebGL error overlay */
  #no-webgl {
    display: none;
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    color: var(--neon-pink);
    font-family: var(--font-mono);
    font-size: 14px; letter-spacing: 0.1em;
    align-items: center; justify-content: center; text-align: center;
    flex-direction: column; gap: 8px;
  }
  #no-webgl.show { display: flex; }
</style>
</head>
<body>

<div id="no-webgl" role="alert">
  <span>WebGL not supported</span>
  <span style="font-size:10px;color:var(--muted)">Try a modern browser with hardware acceleration enabled</span>
</div>

<a id="back" href="index.html">← concepts</a>

<div id="label">
  <div class="title">Resonance</div>
  <div class="hint">audio-reactive visualizer</div>
</div>

<button id="play-btn" aria-label="Play soundscape">▶ PLAY</button>

<div id="controls">
  <button id="mic-btn" aria-label="Toggle microphone input">🎤 mic</button>
  <button id="stop-btn" aria-label="Stop audio">■ stop</button>
</div>

<div id="name">
  <div class="full">Dhruv Kothari</div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── WebGL guard ──────────────────────────────────────────────────────────────
const canvas = document.createElement('canvas');
const hasWebGL = !!(
  canvas.getContext('webgl2') ||
  canvas.getContext('webgl') ||
  canvas.getContext('experimental-webgl')
);
if (!hasWebGL) {
  document.getElementById('no-webgl').classList.add('show');
  document.getElementById('play-btn').style.display = 'none';
  throw new Error('WebGL unavailable — halting'); // surfaced as uncaught but intentional guard
}

// ─── Audio state ──────────────────────────────────────────────────────────────
let audioCtx = null;
let analyser = null;
let masterGain = null;
let synthNodes = [];
let micStream = null;
let micSource = null;
let micActive = false;
let audioPlaying = false;
const FFT_SIZE = 1024;
const BIN_COUNT = FFT_SIZE / 2;
let freqData = new Uint8Array(BIN_COUNT);
let smoothedFreq = new Float32Array(BIN_COUNT);
const SMOOTH = 0.82; // lerp factor toward new value (higher = more persistence)

// ─── Three.js setup ───────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
scene.fog = new THREE.FogExp2(0x050508, 0.06);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);

// ─── Post-processing ──────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.4,   // strength
  0.55,  // radius
  0.2    // threshold
);
composer.addPass(bloom);

// ─── Radial spectrum bars ─────────────────────────────────────────────────────
const BAR_COUNT = 128;
const RING_RADIUS = 7;
const BAR_W = 0.12;
const BAR_MAX_H = 6;

const barMeshes = [];
const barGeo = new THREE.BoxGeometry(BAR_W, 1, BAR_W);
barGeo.translate(0, 0.5, 0); // pivot at bottom

const barMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0x00ffe7),
  emissive: new THREE.Color(0x00ffe7),
  emissiveIntensity: 1.2,
  roughness: 0.3,
  metalness: 0.5,
});

for (let i = 0; i < BAR_COUNT; i++) {
  const angle = (i / BAR_COUNT) * Math.PI * 2;
  const mesh = new THREE.Mesh(barGeo, barMat.clone());
  mesh.position.set(
    Math.cos(angle) * RING_RADIUS,
    0,
    Math.sin(angle) * RING_RADIUS
  );
  mesh.rotation.y = -angle;
  // tilt outward
  mesh.rotation.z = -Math.PI / 2 * 0;
  // orient bar to point outward from center
  mesh.lookAt(new THREE.Vector3(
    Math.cos(angle) * (RING_RADIUS + 1),
    0,
    Math.sin(angle) * (RING_RADIUS + 1)
  ));
  mesh.rotateX(Math.PI / 2); // stand up
  scene.add(mesh);
  barMeshes.push(mesh);
}

// ─── Central icosphere ────────────────────────────────────────────────────────
const sphereGeo = new THREE.IcosahedronGeometry(3, 4);
const sphereMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0x1a0030),
  emissive: new THREE.Color(0x3300aa),
  emissiveIntensity: 0.6,
  roughness: 0.4,
  metalness: 0.8,
  wireframe: false,
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
scene.add(sphere);

// Wireframe overlay on sphere
const wireGeo = new THREE.IcosahedronGeometry(3.02, 2);
const wireMat = new THREE.MeshBasicMaterial({
  color: new THREE.Color(0x4400ff),
  wireframe: true,
  transparent: true,
  opacity: 0.18,
});
const wireframe = new THREE.Mesh(wireGeo, wireMat);
scene.add(wireframe);

// ─── Particle ring ────────────────────────────────────────────────────────────
const PARTICLE_COUNT = 600;
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleAngles = new Float32Array(PARTICLE_COUNT);
const particleRadii = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const r = RING_RADIUS * 1.5 + (Math.random() - 0.5) * 5;
  particleAngles[i] = angle;
  particleRadii[i] = r;
  particlePositions[i * 3]     = Math.cos(angle) * r;
  particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 2;
  particlePositions[i * 3 + 2] = Math.sin(angle) * r;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0xbf00ff,
  size: 0.12,
  transparent: true,
  opacity: 0.55,
  sizeAttenuation: true,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ─── Ambient lighting ─────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x111133, 0.8);
scene.add(ambientLight);
const pointLight1 = new THREE.PointLight(0x00ffe7, 2, 40);
pointLight1.position.set(0, 8, 0);
scene.add(pointLight1);
const pointLight2 = new THREE.PointLight(0xbf00ff, 1.5, 40);
pointLight2.position.set(-10, -4, 5);
scene.add(pointLight2);

// ─── Store original vertex positions for sphere displacement ──────────────────
const origSphereVerts = Float32Array.from(sphereGeo.attributes.position.array);

// ─── Audio synthesis ──────────────────────────────────────────────────────────
function buildSynth(ctx, dest) {
  const nodes = [];

  // Bass sine
  const bass = ctx.createOscillator();
  const bassGain = ctx.createGain();
  bass.type = 'sine';
  bass.frequency.value = 55;
  bassGain.gain.value = 0.22;
  bass.connect(bassGain);
  bassGain.connect(dest);
  bass.start();
  nodes.push(bass, bassGain);

  // Detuned saw pad through lowpass + LFO
  const padFreqs = [110, 110.7, 109.3, 220.5, 219.8];
  padFreqs.forEach((f, idx) => {
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = f;
    const g = ctx.createGain();
    g.gain.value = 0.04;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 700;
    lp.Q.value = 2;
    // LFO for filter cutoff
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.frequency.value = 0.12 + idx * 0.03;
    lfoGain.gain.value = 300;
    lfo.connect(lfoGain);
    lfoGain.connect(lp.frequency);
    lfo.start();
    osc.connect(g);
    g.connect(lp);
    lp.connect(dest);
    osc.start();
    nodes.push(osc, g, lp, lfo, lfoGain);
  });

  // Reverb-style convolver approximation via delay feedback
  const delay = ctx.createDelay(2.0);
  delay.delayTime.value = 0.38;
  const delayFeedback = ctx.createGain();
  delayFeedback.gain.value = 0.45;
  const delayOut = ctx.createGain();
  delayOut.gain.value = 0.08;
  delay.connect(delayFeedback);
  delayFeedback.connect(delay);
  delay.connect(delayOut);
  delayOut.connect(dest);
  nodes.push(delay, delayFeedback, delayOut);

  // Arpeggio — occasional high notes
  const arpNotes = [440, 554.37, 659.26, 880, 1108.73, 659.26, 554.37, 440];
  let arpIdx = 0;
  let arpOsc = null;
  let arpGain = ctx.createGain();
  arpGain.gain.value = 0;
  arpGain.connect(delay);
  arpGain.connect(dest);
  nodes.push(arpGain);

  function scheduleArp() {
    const now = ctx.currentTime;
    if (arpOsc) { try { arpOsc.stop(now + 0.18); } catch(e) {} }
    arpOsc = ctx.createOscillator();
    arpOsc.type = 'triangle';
    arpOsc.frequency.value = arpNotes[arpIdx % arpNotes.length];
    arpOsc.connect(arpGain);
    arpOsc.start(now);
    arpOsc.stop(now + 0.15);
    arpGain.gain.cancelScheduledValues(now);
    arpGain.gain.setValueAtTime(0.09, now);
    arpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
    arpIdx++;
    const nextDelay = 0.36 + Math.random() * 0.18;
    setTimeout(scheduleArp, nextDelay * 1000);
  }
  setTimeout(scheduleArp, 800);

  return nodes;
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.85;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = FFT_SIZE;
  analyser.smoothingTimeConstant = 0.0; // we smooth manually
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  smoothedFreq = new Float32Array(analyser.frequencyBinCount);
}

function startSynth() {
  stopSynth();
  initAudio();
  synthNodes = buildSynth(audioCtx, masterGain);
  audioPlaying = true;
}

function stopSynth() {
  if (!audioCtx) return;
  synthNodes.forEach(n => {
    try { if (n.stop) n.stop(); } catch(e) {}
    try { n.disconnect(); } catch(e) {}
  });
  synthNodes = [];
}

async function startMic() {
  if (!audioCtx) initAudio();
  stopSynth();
  audioPlaying = false;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    micSource = audioCtx.createMediaStreamSource(micStream);
    micSource.connect(masterGain);
    micActive = true;
  } catch(err) {
    console.warn('Mic access denied:', err.message);
    // graceful — fall back to synth
    micActive = false;
    startSynth();
    document.getElementById('mic-btn').classList.remove('active');
  }
}

function stopMic() {
  if (micSource) { try { micSource.disconnect(); } catch(e) {} micSource = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  micActive = false;
}

// ─── UI interactions ──────────────────────────────────────────────────────────
const playBtn = document.getElementById('play-btn');
const micBtn  = document.getElementById('mic-btn');
const stopBtn = document.getElementById('stop-btn');
const controls = document.getElementById('controls');

playBtn.addEventListener('click', () => {
  playBtn.style.display = 'none';
  controls.classList.add('visible');
  startSynth();
});

micBtn.addEventListener('click', async () => {
  if (micActive) {
    stopMic();
    micBtn.classList.remove('active');
    startSynth();
  } else {
    micBtn.classList.add('active');
    await startMic();
    if (!micActive) micBtn.classList.remove('active'); // permission denied
  }
});

stopBtn.addEventListener('click', () => {
  stopMic();
  stopSynth();
  audioPlaying = false;
  micActive = false;
  micBtn.classList.remove('active');
  controls.classList.remove('visible');
  playBtn.style.display = '';
});

// ─── Resize handler ───────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth, innerHeight);
});

// ─── Color helpers ────────────────────────────────────────────────────────────
const colorCool = new THREE.Color(0x00ffe7);
const colorWarm = new THREE.Color(0xff006a);
const colorMid  = new THREE.Color(0xbf00ff);
const tmpColor  = new THREE.Color();

function energyColor(t) {
  // t in [0,1]: 0=cool, 0.5=purple, 1=hot pink
  if (t < 0.5) {
    return tmpColor.copy(colorCool).lerp(colorMid, t * 2);
  } else {
    return tmpColor.copy(colorMid).lerp(colorWarm, (t - 0.5) * 2);
  }
}

// ─── Main animation loop ──────────────────────────────────────────────────────
let t = 0;
const clock = new THREE.Clock();
// Vertex displacement scratch
const posAttr = sphereGeo.attributes.position;
const norms = [];
for (let i = 0; i < origSphereVerts.length / 3; i++) {
  const v = new THREE.Vector3(origSphereVerts[i*3], origSphereVerts[i*3+1], origSphereVerts[i*3+2]);
  norms.push(v.clone().normalize());
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;

  // ── Read FFT ────────────────────────────────────────────────────────────────
  let bassEnergy = 0;
  let overallEnergy = 0;

  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    for (let i = 0; i < smoothedFreq.length; i++) {
      smoothedFreq[i] = smoothedFreq[i] * SMOOTH + (freqData[i] / 255.0) * (1 - SMOOTH);
    }
    // Bass = bins 0..15
    for (let i = 0; i < 16; i++) bassEnergy += smoothedFreq[i];
    bassEnergy /= 16;
    for (let i = 0; i < smoothedFreq.length; i++) overallEnergy += smoothedFreq[i];
    overallEnergy /= smoothedFreq.length;
  } else {
    // idle breathing
    bassEnergy = 0.05 + 0.04 * Math.sin(t * 0.9);
    overallEnergy = 0.03 + 0.025 * Math.sin(t * 0.7);
  }

  const energyT = Math.min(overallEnergy * 3.5, 1.0); // normalize to [0,1]

  // ── Bars ────────────────────────────────────────────────────────────────────
  const binStep = Math.floor(smoothedFreq.length / BAR_COUNT);
  const col = energyColor(energyT);
  for (let i = 0; i < BAR_COUNT; i++) {
    const binIdx = i * binStep;
    const val = analyser
      ? smoothedFreq[binIdx]
      : 0.02 + 0.015 * Math.sin(t * 1.2 + i * 0.15);
    const h = Math.max(0.04, val * BAR_MAX_H);
    barMeshes[i].scale.y = h;
    const m = barMeshes[i].material;
    m.color.copy(col);
    m.emissive.copy(col);
    m.emissiveIntensity = 0.8 + val * 2.5;
  }

  // ── Sphere displacement ─────────────────────────────────────────────────────
  const baseScale = 1 + bassEnergy * 0.7;
  sphere.scale.setScalar(baseScale);
  wireframe.scale.setScalar(baseScale * 1.005);

  // Displace individual verts by bass-weighted noise
  for (let i = 0; i < norms.length; i++) {
    const disp = bassEnergy * 0.9 * Math.sin(t * 2.8 + norms[i].x * 4 + norms[i].y * 3);
    posAttr.setXYZ(
      i,
      origSphereVerts[i*3]     + norms[i].x * disp,
      origSphereVerts[i*3 + 1] + norms[i].y * disp,
      origSphereVerts[i*3 + 2] + norms[i].z * disp
    );
  }
  posAttr.needsUpdate = true;
  sphereGeo.computeVertexNormals();

  // Sphere color
  sphereMat.emissive.copy(energyColor(energyT * 0.6));
  sphereMat.emissiveIntensity = 0.4 + energyT * 1.4;

  // ── Particles ───────────────────────────────────────────────────────────────
  const pos = particleGeo.attributes.position;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particleAngles[i] += (0.0004 + overallEnergy * 0.003);
    const r = particleRadii[i] + overallEnergy * 1.5 * Math.sin(t * 1.5 + i);
    pos.setX(i, Math.cos(particleAngles[i]) * r);
    pos.setZ(i, Math.sin(particleAngles[i]) * r);
    const yOrig = pos.getY(i);
    pos.setY(i, yOrig + Math.sin(t * 0.8 + i * 0.05) * 0.005);
  }
  pos.needsUpdate = true;
  particleMat.color.copy(energyColor(energyT));
  particleMat.opacity = 0.3 + energyT * 0.5;

  // ── Slow camera orbit ───────────────────────────────────────────────────────
  const camR = 22;
  camera.position.x = Math.sin(t * 0.06) * camR;
  camera.position.z = Math.cos(t * 0.06) * camR;
  camera.position.y = Math.sin(t * 0.04) * 3;
  camera.lookAt(0, 0, 0);

  // ── Bloom energy ────────────────────────────────────────────────────────────
  bloom.strength = 1.1 + energyT * 1.2;

  // ── Point lights pulse ──────────────────────────────────────────────────────
  pointLight1.intensity = 1.5 + bassEnergy * 6;
  pointLight2.intensity = 1.0 + overallEnergy * 4;

  composer.render();
}

animate();
</script>
</body>
</html>
