<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECODER — Dhruv Kothari</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New',Courier,monospace}
  #no-webgl{display:none;position:fixed;inset:0;background:#000;color:#0f0;font-family:'Courier New',monospace;font-size:1.2rem;align-items:center;justify-content:center;text-align:center;z-index:999}
  canvas{display:block}
  #back{position:fixed;top:14px;left:16px;color:#0a0;font-family:'Courier New',Courier,monospace;font-size:11px;text-decoration:none;letter-spacing:.04em;opacity:.7;z-index:10;transition:opacity .2s}
  #back:hover{opacity:1}
  #label{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#0f0;font-family:'Courier New',Courier,monospace;font-size:13px;letter-spacing:.3em;opacity:.85;z-index:10;text-align:center;pointer-events:none}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#0a0;font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:.15em;opacity:.5;z-index:10;pointer-events:none}
  #sig{position:fixed;bottom:30px;right:16px;color:#0a0;font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:.05em;opacity:.4;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="no-webgl">WebGL not supported.</div>
<a id="back" href="index.html">← concepts</a>
<div id="label">DECODER</div>
<div id="hint">rotate with mouse</div>
<div id="sig">Dhruv Kothari</div>

<script type="module">
import * as THREE from 'three';

// ─── WebGL guard ────────────────────────────────────────────────────────────
const canvas2d = document.createElement('canvas');
const gl = canvas2d.getContext('webgl') || canvas2d.getContext('experimental-webgl');
if (!gl) {
  document.getElementById('no-webgl').style.display = 'flex';
  throw new Error('WebGL not available');
}

// ─── Glyph atlas ─────────────────────────────────────────────────────────────
// Characters ordered dark → light
const GLYPHS = ' .\'`^",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
const CELL_W = 10;  // atlas cell width px
const CELL_H = 16;  // atlas cell height px

function buildGlyphAtlas() {
  const cols = GLYPHS.length;
  const atlasCv = document.createElement('canvas');
  atlasCv.width  = CELL_W * cols;
  atlasCv.height = CELL_H;
  const ctx = atlasCv.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, atlasCv.width, CELL_H);
  ctx.fillStyle = '#fff';
  ctx.font = `${CELL_H - 2}px 'Courier New', monospace`;
  ctx.textBaseline = 'top';
  for (let i = 0; i < cols; i++) {
    ctx.fillText(GLYPHS[i], i * CELL_W + 1, 1);
  }
  const tex = new THREE.CanvasTexture(atlasCv);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return { tex, cols };
}

// ─── Scene setup ─────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene   = new THREE.Scene();
const camera  = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.5);

// Lights
const ambient = new THREE.AmbientLight(0x003300, 1.5);
scene.add(ambient);

const dir1 = new THREE.DirectionalLight(0x00ff66, 3.5);
dir1.position.set(3, 4, 3);
scene.add(dir1);

const dir2 = new THREE.DirectionalLight(0x00aa44, 1.5);
dir2.position.set(-3, -2, 2);
scene.add(dir2);

const pt = new THREE.PointLight(0x00ff00, 2, 10);
pt.position.set(0, 0, 3);
scene.add(pt);

// TorusKnot object
const geo  = new THREE.TorusKnotGeometry(1.1, 0.38, 160, 24, 2, 3);
const mat  = new THREE.MeshPhongMaterial({
  color: 0x00ff44,
  emissive: 0x002200,
  shininess: 80,
  specular: 0x00ff00,
});
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

// Small orbiting satellite sphere for extra movement interest
const sGeo = new THREE.IcosahedronGeometry(0.22, 1);
const sMat = new THREE.MeshPhongMaterial({ color: 0x00ff00, emissive: 0x001100 });
const sat  = new THREE.Mesh(sGeo, sMat);
scene.add(sat);

// ─── Low-res render target ────────────────────────────────────────────────────
// Grid of ~150×84 ASCII cells
const COLS = 150;
const ROWS = 84;
const rt = new THREE.WebGLRenderTarget(COLS, ROWS, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  type: THREE.UnsignedByteType,
});

// ─── Post quad (ASCII shader) ─────────────────────────────────────────────────
const { tex: atlasTex, cols: atlasCount } = buildGlyphAtlas();

const postScene  = new THREE.Scene();
const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const postGeo = new THREE.PlaneGeometry(2, 2);
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    uScene:      { value: rt.texture },
    uAtlas:      { value: atlasTex },
    uAtlasCols:  { value: atlasCount },
    uGridSize:   { value: new THREE.Vector2(COLS, ROWS) },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uTime:       { value: 0.0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;

    uniform sampler2D uScene;
    uniform sampler2D uAtlas;
    uniform float     uAtlasCols;
    uniform vec2      uGridSize;
    uniform vec2      uResolution;
    uniform float     uTime;

    // luminance of a colour
    float luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }

    void main(){
      // ── which cell are we in? ──────────────────────────────────────────
      vec2 cell = floor(vUv * uGridSize);          // integer cell index
      vec2 cellUv = fract(vUv * uGridSize);        // position within cell [0,1]

      // sample scene colour at cell centre
      vec2 sampleUv = (cell + 0.5) / uGridSize;
      vec3 sceneCol = texture2D(uScene, sampleUv).rgb;
      float bright  = luma(sceneCol);

      // ── pick glyph from atlas ──────────────────────────────────────────
      float idx = floor(bright * (uAtlasCols - 1.0));
      // atlas UV: x spans from idx/cols to (idx+1)/cols, y is [0,1]
      float ax = (idx + cellUv.x) / uAtlasCols;
      float ay = cellUv.y;
      float glyphAlpha = texture2D(uAtlas, vec2(ax, ay)).r;

      // ── green phosphor colour ──────────────────────────────────────────
      // dim background tint + bright glyph
      vec3 bgCol    = vec3(0.0, 0.012, 0.0);
      vec3 phosphor = vec3(0.0, 1.0, 0.2) * bright;
      // mix background with bright glyph pixel
      vec3 col = mix(bgCol, phosphor * 1.1, glyphAlpha);

      // ── scanlines ─────────────────────────────────────────────────────
      float scanline = sin(vUv.y * uResolution.y * 3.14159) * 0.5 + 0.5;
      col *= mix(0.82, 1.0, scanline);

      // ── flicker ───────────────────────────────────────────────────────
      float flicker = 0.97 + 0.03 * sin(uTime * 31.7);
      col *= flicker;

      // ── vignette ──────────────────────────────────────────────────────
      vec2 ctr = vUv - 0.5;
      float vig = 1.0 - dot(ctr, ctr) * 2.2;
      vig = clamp(vig, 0.0, 1.0);
      col *= vig;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const postQuad = new THREE.Mesh(postGeo, postMat);
postScene.add(postQuad);

// ─── Mouse drag ──────────────────────────────────────────────────────────────
let isDragging = false;
let prevX = 0, prevY = 0;
let rotX = 0, rotY = 0;
let velX = 0, velY = 0;
const DRAG_SPEED = 0.008;
const INERTIA    = 0.92;

const cvEl = renderer.domElement;
cvEl.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mouseup',   () => { isDragging = false; });
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  velX = (e.clientY - prevY) * DRAG_SPEED;
  velY = (e.clientX - prevX) * DRAG_SPEED;
  prevX = e.clientX; prevY = e.clientY;
});
// Touch
cvEl.addEventListener('touchstart', e => { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend',   () => { isDragging = false; });
window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  velX = (e.touches[0].clientY - prevY) * DRAG_SPEED;
  velY = (e.touches[0].clientX - prevX) * DRAG_SPEED;
  prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
}, { passive: true });

// ─── Resize ───────────────────────────────────────────────────────────────────
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  postMat.uniforms.uResolution.value.set(w, h);
}
window.addEventListener('resize', onResize);

// ─── Animation loop ───────────────────────────────────────────────────────────
let lastTime = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const t = now * 0.001;
  const dt = Math.min(t - lastTime, 0.05);
  lastTime = t;

  // auto-rotate + inertia
  if (!isDragging) {
    velX *= INERTIA;
    velY *= INERTIA;
    rotX += 0.004;    // auto tilt
    rotY += 0.009;    // auto spin
  }
  rotX += velX;
  rotY += velY;

  mesh.rotation.x = rotX;
  mesh.rotation.y = rotY;
  mesh.rotation.z = t * 0.12;

  // satellite orbit
  sat.position.set(
    Math.cos(t * 0.8) * 2.0,
    Math.sin(t * 0.6) * 1.2,
    Math.sin(t * 0.8) * 1.5
  );
  sat.rotation.y = t * 2;

  postMat.uniforms.uTime.value = t;

  // 1) render scene to low-res RT
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);

  // 2) render ASCII post quad to screen
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCamera);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
