<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Particle Genesis — Dhruv Kothari</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace}
canvas{display:block}
#back{
  position:fixed;top:18px;left:20px;z-index:100;
  color:#444;font-size:11px;font-family:monospace;
  text-decoration:none;letter-spacing:0.05em;
  transition:color .2s;
}
#back:hover{color:#888}
#label{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:100;text-align:center;pointer-events:none;
}
#concept-name{
  font-size:11px;letter-spacing:.22em;color:#38e1ff;
  font-family:monospace;text-transform:uppercase;opacity:.7;
}
#hint{
  font-size:10px;letter-spacing:.12em;color:#5a5a7a;
  font-family:monospace;margin-top:5px;
}
#hud{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:100;text-align:center;pointer-events:none;
}
#morph-target{
  font-size:13px;letter-spacing:.28em;color:#a06bff;
  font-family:monospace;text-transform:uppercase;opacity:.9;
  transition:opacity .4s;
}
#fallback{
  display:none;position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:#888;font-family:monospace;font-size:13px;
  text-align:center;line-height:1.8;
}
</style>
</head>
<body>
<a id="back" href="../index.html">← concepts</a>
<div id="hud"><div id="morph-target">DHRUV</div></div>
<div id="label">
  <div id="concept-name">Particle Genesis</div>
  <div id="hint">click / scroll to morph &nbsp;·&nbsp; move the mouse to disturb the field</div>
</div>
<div id="fallback">WebGL float textures unavailable.<br>Try a desktop browser.</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
import { EffectComposer }         from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }             from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }        from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ── constants ──────────────────────────────────────────────────── */
const SIM   = 512;          // 512×512 = 262144 particles
const COUNT = SIM * SIM;
const TARGETS = ['DHRUV', 'FORM', 'REDDIT GROWTH COPILOT'];
let   targetIdx = 0;
let   autoTimer = 0;
const AUTO_INTERVAL = 6; // seconds

/* ── renderer ───────────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* float texture support check */
const gl = renderer.getContext();
if (!gl.getExtension('OES_texture_float') && !gl.getExtension('EXT_color_buffer_float')) {
  document.getElementById('fallback').style.display = 'block';
  renderer.domElement.style.display = 'none';
  throw new Error('No float render targets');
}

/* ── scene / camera ─────────────────────────────────────────────── */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 0, 5);

/* ── GPGPU ──────────────────────────────────────────────────────── */
const gpuCompute = new GPUComputationRenderer(SIM, SIM, renderer);

/* seed position / velocity textures */
const dtPosition = gpuCompute.createTexture();
const dtVelocity = gpuCompute.createTexture();
{
  const dp = dtPosition.image.data;
  const dv = dtVelocity.image.data;
  for (let i = 0; i < COUNT; i++) {
    const phi   = Math.acos(2 * Math.random() - 1);
    const theta = 2 * Math.PI * Math.random();
    const r     = 2.5 + Math.random() * 0.3;
    dp[i*4+0] = r * Math.sin(phi) * Math.cos(theta);
    dp[i*4+1] = r * Math.sin(phi) * Math.sin(theta);
    dp[i*4+2] = r * Math.cos(phi);
    dp[i*4+3] = 1;
    dv[i*4+0] = dv[i*4+1] = dv[i*4+2] = 0;
    dv[i*4+3] = 1;
  }
}

/* ── target texture builder ─────────────────────────────────────── */
function buildTextTexture(text) {
  const W = 512, H = 160;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  const fs = text.length > 8 ? 48 : 80;
  ctx.font = `bold ${fs}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W/2, H/2);

  const pxData = ctx.getImageData(0, 0, W, H).data;
  const pts = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const a = pxData[(y*W+x)*4+3];
      if (a > 128) {
        pts.push([
          (x/W - 0.5) * 6,
          -(y/H - 0.5) * 2.5,
          (Math.random() - 0.5) * 0.12
        ]);
      }
    }
  }
  return pts;
}

function buildFormTexture() {
  const pts = [];
  // torus knot surface samples
  const p = 2, q = 3;
  for (let i = 0; i < 120000; i++) {
    const t = (i / 120000) * Math.PI * 2;
    const r = Math.cos(q*t) + 2;
    const x = r * Math.cos(p*t);
    const y = r * Math.sin(p*t);
    const z = -Math.sin(q*t);
    pts.push([x * 0.7, y * 0.7, z * 0.7]);
  }
  return pts;
}

function ptsToTexture(pts) {
  const data = new Float32Array(COUNT * 4);
  for (let i = 0; i < COUNT; i++) {
    const src = pts[i % pts.length];
    data[i*4+0] = src[0] + (Math.random()-0.5)*0.04;
    data[i*4+1] = src[1] + (Math.random()-0.5)*0.04;
    data[i*4+2] = src[2] + (Math.random()-0.5)*0.04;
    data[i*4+3] = 1;
  }
  const tex = new THREE.DataTexture(data, SIM, SIM, THREE.RGBAFormat, THREE.FloatType);
  tex.needsUpdate = true;
  return tex;
}

const targetTextures = [
  ptsToTexture(buildTextTexture('DHRUV')),
  ptsToTexture(buildFormTexture()),
  ptsToTexture(buildTextTexture('REDDIT GROWTH COPILOT')),
];

/* ── velocity shader ────────────────────────────────────────────── */
const velShader = /* glsl */`
uniform sampler2D uTarget;
uniform vec3  uMouse;
uniform float uTime;
uniform float uDelta;

// === curl / simplex noise ===
vec3 mod289v3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289v4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289v4(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
vec3 snoiseGrad(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);
  const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289v3(i);
  vec4 p=permute(permute(permute(
    i.z+vec4(0.,i1.z,i2.z,1.))
    +i.y+vec4(0.,i1.y,i2.y,1.))
    +i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.*x_);
  vec4 x4=x_*ns.x+ns.yyyy;
  vec4 y4=y_*ns.x+ns.yyyy;
  vec4 h=1.-abs(x4)-abs(y4);
  vec4 b0=vec4(x4.xy,y4.xy);
  vec4 b1=vec4(x4.zw,y4.zw);
  vec4 s0=floor(b0)*2.+1.;
  vec4 s1=floor(b1)*2.+1.;
  vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
  vec4 m2=m*m;
  vec4 m4=m2*m2;
  vec4 pdotx=vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3));
  vec4 temp=m2*m*pdotx;
  vec3 grad=-8.*
    (temp.x*x0+temp.y*x1+temp.z*x2+temp.w*x3)+
    m4.x*p0+m4.y*p1+m4.z*p2+m4.w*p3;
  return 105.*grad;
}
vec3 curl(vec3 p){
  float e=.02;
  vec3 dx=vec3(e,0.,0.),dy=vec3(0.,e,0.),dz=vec3(0.,0.,e);
  float nx0=snoiseGrad(p+dx).x,nx1=snoiseGrad(p-dx).x;
  float ny0=snoiseGrad(p+dy).y,ny1=snoiseGrad(p-dy).y;
  float nz0=snoiseGrad(p+dz).z,nz1=snoiseGrad(p-dz).z;
  return vec3(ny0-ny1-(nz0-nz1),nz0-nz1-(nx0-nx1),nx0-nx1-(ny0-ny1))/(2.*e);
}

void main(){
  vec2 uv=gl_FragCoord.xy/resolution.xy;
  vec4 posData=texture2D(texturePosition,uv);
  vec4 velData=texture2D(textureVelocity,uv);
  vec3 pos=posData.xyz;
  vec3 vel=velData.xyz;
  vec3 tgt=texture2D(uTarget,uv).xyz;

  // spring toward target
  vec3 toTarget=tgt-pos;
  float dist=length(toTarget);
  vec3 spring=toTarget*2.4;

  // curl turbulence
  float noiseScale=0.55;
  vec3 noisePos=pos*noiseScale+vec3(uTime*0.08);
  vec3 curlForce=curl(noisePos)*0.18;

  // mouse repulsion
  vec3 toMouse=pos-uMouse;
  float md=length(toMouse);
  float repulse=smoothstep(1.2,0.,md);
  vec3 mouseForce=normalize(toMouse+vec3(0.0001))*repulse*3.5;

  // integrate
  float damp=0.88;
  vel=(vel+( spring + curlForce + mouseForce )*uDelta)*damp;
  gl_FragColor=vec4(vel,1.);
}
`;

/* ── position shader ────────────────────────────────────────────── */
const posShader = /* glsl */`
uniform float uDelta;
void main(){
  vec2 uv=gl_FragCoord.xy/resolution.xy;
  vec3 pos=texture2D(texturePosition,uv).xyz;
  vec3 vel=texture2D(textureVelocity,uv).xyz;
  pos+=vel*uDelta;
  gl_FragColor=vec4(pos,1.);
}
`;

const velVar = gpuCompute.addVariable('textureVelocity', velShader, dtVelocity);
const posVar = gpuCompute.addVariable('texturePosition', posShader, dtPosition);

gpuCompute.setVariableDependencies(velVar, [velVar, posVar]);
gpuCompute.setVariableDependencies(posVar, [posVar, velVar]);

/* set initial uniforms on velocity variable */
const velUniforms = velVar.material.uniforms;
velUniforms.uTarget  = { value: targetTextures[0] };
velUniforms.uMouse   = { value: new THREE.Vector3(9999, 9999, 0) };
velUniforms.uTime    = { value: 0 };
velUniforms.uDelta   = { value: 0.016 };

posVar.material.uniforms.uDelta = { value: 0.016 };

const err = gpuCompute.init();
if (err !== null) {
  console.error('GPUComputationRenderer init error:', err);
  document.getElementById('fallback').style.display = 'block';
  renderer.domElement.style.display = 'none';
  throw new Error(err);
}

/* ── particle geometry ──────────────────────────────────────────── */
const geo = new THREE.BufferGeometry();
const uvs = new Float32Array(COUNT * 2);
for (let i = 0; i < COUNT; i++) {
  uvs[i*2+0] = (i % SIM) / SIM;
  uvs[i*2+1] = Math.floor(i / SIM) / SIM;
}
geo.setAttribute('aUv', new THREE.BufferAttribute(uvs, 2));
geo.setDrawRange(0, COUNT);

/* particle material */
const partMat = new THREE.ShaderMaterial({
  uniforms: {
    uPositionTex: { value: null },
    uVelocityTex: { value: null },
    uSize:        { value: 2.2 },
    uResolution:  { value: new THREE.Vector2(innerWidth, innerHeight) },
  },
  vertexShader: /* glsl */`
    uniform sampler2D uPositionTex;
    uniform sampler2D uVelocityTex;
    uniform float     uSize;
    attribute vec2    aUv;
    varying   vec3    vColor;
    varying   float   vSpeed;

    void main(){
      vec3 pos = texture2D(uPositionTex, aUv).xyz;
      vec3 vel = texture2D(uVelocityTex, aUv).xyz;
      vSpeed = clamp(length(vel)*0.5, 0., 1.);

      // color: cyan → violet by speed
      vec3 cyan   = vec3(0.220, 0.882, 1.000);
      vec3 violet = vec3(0.627, 0.420, 1.000);
      vColor = mix(cyan, violet, vSpeed);

      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      gl_Position  = projectionMatrix * mvPos;
      gl_PointSize = uSize * (180.0 / -mvPos.z);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3  vColor;
    varying float vSpeed;
    void main(){
      vec2  c    = gl_PointCoord - 0.5;
      float disc = dot(c, c);
      if(disc > 0.25) discard;
      float alpha = (1.0 - disc*4.0);
      alpha = pow(alpha, 1.6);
      gl_FragColor = vec4(vColor * (0.7 + vSpeed*0.5), alpha * 0.85);
    }
  `,
  transparent: true,
  blending:    THREE.AdditiveBlending,
  depthWrite:  false,
});

const points = new THREE.Points(geo, partMat);
scene.add(points);

/* ── background gradient ────────────────────────────────────────── */
{
  const bgGeo = new THREE.PlaneGeometry(2, 2);
  const bgMat = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader:`void main(){gl_Position=vec4(position.xy,1.,1.);}`,
    fragmentShader:`
      void main(){
        vec2 uv = gl_FragCoord.xy/vec2(${innerWidth}.0,${innerHeight}.0);
        vec2 c  = uv - 0.5;
        float r = length(c);
        float g = smoothstep(0.8, 0.0, r);
        vec3 bg = mix(vec3(0.00,0.00,0.02), vec3(0.03,0.01,0.06), g*0.5);
        gl_FragColor = vec4(bg, 1.0);
      }
    `,
    depthWrite: false,
    depthTest:  false,
  });
  const bgMesh = new THREE.Mesh(bgGeo, bgMat);
  bgMesh.renderOrder = -1;
  scene.add(bgMesh);
}

/* ── post processing ────────────────────────────────────────────── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.80,   // strength
  0.55,   // radius
  0.10    // threshold
);
composer.addPass(bloom);

/* ── mouse ──────────────────────────────────────────────────────── */
const mouse = new THREE.Vector3(9999, 9999, 0);
window.addEventListener('mousemove', e => {
  const nx = (e.clientX / innerWidth)  * 2 - 1;
  const ny = -(e.clientY / innerHeight) * 2 + 1;
  // unproject to z=0 plane
  const vec = new THREE.Vector3(nx, ny, 0.5).unproject(camera);
  const dir = vec.sub(camera.position).normalize();
  const t   = -camera.position.z / dir.z;
  mouse.copy(camera.position).addScaledVector(dir, t);
});

/* ── target cycling ─────────────────────────────────────────────── */
const morphLabel = document.getElementById('morph-target');
function advanceTarget() {
  targetIdx = (targetIdx + 1) % TARGETS.length;
  velUniforms.uTarget.value = targetTextures[targetIdx];
  morphLabel.textContent = TARGETS[targetIdx];
  autoTimer = 0;
}
window.addEventListener('click', advanceTarget);
window.addEventListener('wheel', advanceTarget, { passive: true });

/* ── resize ─────────────────────────────────────────────────────── */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  partMat.uniforms.uResolution.value.set(innerWidth, innerHeight);
});

/* ── loop ───────────────────────────────────────────────────────── */
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt   = Math.min((now - last) * 0.001, 0.05);
  last = now;
  autoTimer += dt;
  if (autoTimer >= AUTO_INTERVAL) advanceTarget();

  velUniforms.uMouse.value.copy(mouse);
  velUniforms.uTime.value  += dt;
  velUniforms.uDelta.value  = dt;
  posVar.material.uniforms.uDelta.value = dt;

  gpuCompute.compute();

  partMat.uniforms.uPositionTex.value =
    gpuCompute.getCurrentRenderTarget(posVar).texture;
  partMat.uniforms.uVelocityTex.value =
    gpuCompute.getCurrentRenderTarget(velVar).texture;

  composer.render();
}
requestAnimationFrame(tick);
</script>
</body>
</html>
