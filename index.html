<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Dhruv Kothari — Full-stack developer</title>
    <meta
      name="description"
      content="Full-stack developer in Mumbai, open to remote internships in AI engineering and growth engineering. Résumé, projects with live demos, or a walk through my 3D desk."
    />

    <!-- Open Graph: this link gets pasted into DMs and LinkedIn far more often
         than it gets typed. The unfurl is part of the first impression. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dhruv Kothari" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Dhruv Kothari — Full-stack developer" />
    <meta
      property="og:description"
      content="Open to remote internships in AI engineering and growth engineering. Résumé, projects with live demos, or a walk through my 3D desk."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A desk with a monitor, lamp and phone in a dark room at night" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />

    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Person","name":"Dhruv Kothari","jobTitle":"Full-stack developer","url":"%VITE_SITE_URL%/","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"},"sameAs":["https://github.com/dhruv4740","https://linkedin.com/in/dhruv4740"]}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Paint the background before any JS runs: no white flash on a dark site. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0A0A0B; }
      /* Front door: painted from HTML alone, so the first seconds are never a grey void.
         The room dismisses it when its first frame is ready (src/v3/lib/frontDoor.js). */
      #front-door {
        position: fixed; inset: 0; z-index: 2147482000;
        display: flex; align-items: center; justify-content: center;
        background: #0A0A0B; color: #ececec; padding: 24px;
        font-family: "Space Grotesk", system-ui, sans-serif;
        transition: opacity .5s ease;
      }
      #front-door .fd-inner { width: min(520px, 100%); }
      #front-door .fd-name { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 500; letter-spacing: -0.03em; line-height: 1.05; margin: 0; }
      #front-door .fd-tag { margin: 14px 0 0; font-size: 1.1rem; line-height: 1.4; color: #bdbdc4; }
      #front-door .fd-load { margin-top: 36px; font: 500 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #9C9CA4; display: flex; justify-content: space-between; }
      #front-door .fd-track { height: 2px; background: #1d2122; margin-top: 10px; overflow: hidden; }
      #front-door .fd-fill { display: block; height: 100%; background: #FF5F1F; transform-origin: left; transform: scaleX(.03); transition: transform .3s ease; }
      #front-door .fd-skip {
        display: inline-flex; align-items: center; gap: .6em; margin-top: 32px;
        padding: 14px 20px; background: #FF5F1F; color: #0A0A0B; border-radius: 2px;
        font: 600 14px/1 "Space Grotesk", system-ui, sans-serif; text-decoration: none;
      }
      #front-door .fd-skip:hover, #front-door .fd-skip:focus-visible { background: #ececec; outline: 2px solid #fff; outline-offset: 2px; }
      #front-door .fd-note { margin: 14px 0 0; font-size: .85rem; color: #8a8a92; }
      #front-door:not([data-leaving]) ~ .escape-link { visibility: hidden; }
      /* Escape hatch: plain markup, first in tab order, visible before any JS or 3D asset. */
      .escape-link {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 2147483000; white-space: nowrap;
        padding: 10px 14px; background: #0A0A0B; color: #ececec;
        border: 1px solid #3a3d41; border-radius: 4px;
        font: 600 14px/1 "Space Grotesk", system-ui, sans-serif; text-decoration: none;
      }
      .escape-link:hover, .escape-link:focus-visible { background: #e4572e; color: #0A0A0B; outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="front-door" role="region" aria-label="Welcome">
      <div class="fd-inner">
        <p class="fd-name">Dhruv Kothari</p>
        <p class="fd-tag">Full-stack developer building Android apps, Python backends and AI integrations.</p>
        <div class="fd-load"><span id="front-door-label">Loading the 3D room</span><span id="front-door-pct">0%</span></div>
        <div class="fd-track"><i class="fd-fill" id="front-door-bar"></i></div>
        <a class="fd-skip" href="/work/">View work and r&eacute;sum&eacute; <span aria-hidden="true">&rarr;</span></a>
        <p class="fd-note">Don&rsquo;t want to wait? Everything is on one page.</p>
      </div>
    </div>
    <noscript><style>#front-door { display: none; } #front-door ~ .escape-link { visibility: visible !important; }</style></noscript>
    <a class="escape-link" href="/work/">View work and resume</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
