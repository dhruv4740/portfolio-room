<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Dhruv Kothari — Creative Developer</title>
    <meta
      name="description"
      content="Creative developer in Mumbai. A photorealistic scan of my desk, and seventeen things I built that run in a browser."
    />

    <!-- Open Graph: this link gets pasted into DMs and LinkedIn far more often
         than it gets typed. The unfurl is part of the first impression. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dhruv Kothari — Creative Developer" />
    <meta
      property="og:description"
      content="A photorealistic scan of my desk, and seventeen things I built that run in a browser."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Paint the background before any JS runs: no white flash on a dark site. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0A0A0B; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
