<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhruv Kothari</title>
<!-- The embedded path has no parser-blocking CDN dependencies. -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="os-beneath"><canvas id="beneath-canvas"></canvas></div>
<div id="tear-shadow"><canvas id="shadow-canvas"></canvas></div>
<div id="flat-site"></div>
<div id="tear-hint"></div>
<button id="intro-skip" type="button">skip →</button>

<div id="boot">
  <div id="boot-lines"></div>
  <div id="boot-progress-wrap"><div id="boot-progress-bar"></div></div>
  <div id="boot-skip-hint">click to skip</div>
</div>

<div id="desktop">
  <div id="menubar">
    <div id="menubar-left">◆</div>
    <div id="menubar-right">
      <button id="sound-toggle" title="Toggle ambient sound">♪ OFF</button>
      <span id="clock">00:00:00</span>
    </div>
  </div>
  <div id="workspace"></div>
  <div id="taskbar"></div>
</div>

<div id="crt" aria-hidden="true"></div>
<div id="crt-flicker" aria-hidden="true"></div>
<div id="crt-chroma" aria-hidden="true"></div>

<script type="module" src="main.js?embed=1"></script>
</body>
</html>
